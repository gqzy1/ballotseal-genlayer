name: Verify and deploy BallotSeal
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect pinned SDK receipt transformation
        run: rg --no-ignore -n -m 30 'leaderReceipt|leader_receipt|executionResult|execution_result|fullTransaction|function getTransaction|simplifyTransaction|consensusData' node_modules/genlayer-js/dist/index.js node_modules/genlayer-js/dist/chunk-*.js
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run verify:source
      - run: npm run build
      - run: npm run format:check
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
